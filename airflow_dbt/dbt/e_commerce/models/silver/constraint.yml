  - name: products
    config:
      contract:
        enforced: true
    
    constraints:
      - type: primary_key
        columns: [product_id]

    columns:
      - name: product_id
        data_type: STRING

      - name: product_category_name
        data_type: STRING

      - name: product_name_length
        data_type: INT

      - name: product_description_length
        data_type: INT

      - name: product_photos_qty
        data_type: INT

      - name: product_weight_g
        data_type: INT

      - name: product_length_cm
        data_type: INT

      - name: product_height_cm
        data_type: INT

      - name: product_width_cm
        data_type: INT

  - name: orders
    config:
      contract:
        enforced: true
    
    constraints:
      - type: primary_key
        columns: [order_id]

    columns:
      - name: order_id
        data_type: STRING

      - name: customer_id
        data_type: STRING

      - name: order_status
        data_type: STRING

      - name: order_purchase_timestamp
        data_type: TIMESTAMP

      - name: order_approved_at
        data_type: TIMESTAMP

      - name: order_delivered_carrier_date
        data_type: TIMESTAMP

      - name: order_delivered_customer_date
        data_type: TIMESTAMP

      - name: order_estimated_delivery_date
        data_type: TIMESTAMP

      - name: cdc_dt
        data_type: DATE

  - name: order_items
    config:
      contract:
        enforced: true
    
    columns:
      - name: order_id
        data_type: STRING

      - name: order_item_id
        data_type: INT

      - name: product_id
        data_type: STRING

      - name: seller_id
        data_type: STRING

      - name: shipping_limit_date
        data_type: TIMESTAMP

      - name: price
        data_type: FLOAT64

      - name: freight_value
        data_type: FLOAT64

      - name: cdc_dt
        data_type: DATE

  - name: payments
    config:
      contract:
        enforced: true
    
    columns:
      - name: order_id
        data_type: STRING

      - name: payment_sequential
        data_type: INT

      - name: payment_type
        data_type: STRING

      - name: payment_installments
        data_type: INT

      - name: payment_value
        data_type: FLOAT64

      - name: cdc_dt
        data_type: DATE

  - name: order_reviews
    config:
      contract:
        enforced: true
    
    columns:
      - name: review_id
        data_type: STRING

      - name: order_id
        data_type: STRING

      - name: review_score
        data_type: INT

      - name: review_comment_title
        data_type: STRING

      - name: review_comment_message
        data_type: STRING

      - name: review_creation_date
        data_type: TIMESTAMP

      - name: review_answer_timestamp
        data_type: TIMESTAMP

      - name: cdc_dt
        data_type: DATE