version: 2

models:

  - name: geolocations
    config:
      contract:
        enforced: true

    constraints:
      - type: primary_key
        columns: [geolocation_zip_code_prefix]    

    columns:
      - name: geolocation_zip_code_prefix
        data_type: INT

      - name: latitude
        data_type: FLOAT64

      - name: longtitude
        data_type: FLOAT64

      - name: city
        data_type: STRING

      - name: state
        data_type: STRING

